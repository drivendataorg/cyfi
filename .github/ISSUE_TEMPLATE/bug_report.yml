name: Bug Report
description: Create a report to help us reproduce and fix a bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please ensure you have checked for existing issues before proceeding.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: e.g., The app crashes when I click the save button on the dashboard.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a step-by-step guide to reproduce the issue.
      placeholder: |
        1. Run `cyfi predict ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Please include error messages or terminal output.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug Logs
      description: |
        Please include the output of your command run with the `-vv` flag for debug logs.
        For example: `cyfi predict sample_points.csv -vv`
      placeholder: |
        Paste your logs here...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CyFi Version
      description: |
        Run `cyfi --version` to find out.
      placeholder: e.g., 1.1.5
    validations:
      required: true
  - type: textarea
    id: additional-info
    attributes:
      label: Additional context
      description: Any other context about the problem here (e.g., specific satellite imagery data).
